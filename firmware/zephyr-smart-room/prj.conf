CONFIG_GPIO=y
CONFIG_ZBUS=y
CONFIG_THREAD_NAME=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Console output
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=n

# Main thread stack
CONFIG_MAIN_STACK_SIZE=2048

# Use a bounded libc arena on the target MCU.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=4096

# Logging over RTT
# Deferred mode is safer once multiple threads publish logs.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_THREAD_ID_PREFIX=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y

# Enlarge RTT up-buffer so full crash dumps aren't overwritten on reset.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# RTT console: printk() + boot banner go to RTT.
CONFIG_RTT_CONSOLE=y
CONFIG_BOOT_BANNER=y

# Fault dump detail for diagnosing crashes.
CONFIG_FAULT_DUMP=2
CONFIG_EXTRA_EXCEPTION_INFO=y

# This application does not use the hardware crypto driver.
CONFIG_HW_CC3XX=n
